name: Security Pipeline

on: push

jobs:

  gate1-bandit:

    name: Gate 1 - Bandit SAST

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install Bandit

        run: pip install bandit

      - name: Run Bandit

        run: bandit -r . -ll

  gate2-safety:

    name: Gate 2 - Safety dependency scan

    needs: gate1-bandit

    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Install Safety

        run: pip install "safety<3"

      - name: Run Safety

        run: safety check -r requirements_pinned.txt

  gate3-gitleaks:

    name: Gate 3 - Gitleaks secret detection

    needs: gate2-safety

    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Install Gitleaks

        run: |

          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz

          tar -xzf gitleaks.tar.gz gitleaks

      - name: Run Gitleaks on the commit diff

        run: ./gitleaks detect --source . --log-opts="-1" --redact -v

  gate4-inject-scanner:

    name: Gate 4 - Custom prompt injection scanner

    needs: gate3-gitleaks

    if: always()

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5

        with:

          python-version: "3.11"

      - name: Run inject_scanner.py

        run: python inject_scanner.py
